      // First-time visitors see the welcome page. Anyone signed in, or arriving

      try {

          !window.Capacitor && location.pathname === '/' && !location.search && !location.hash &&
          !localStorage.getItem('sb-tnukrnluhjvalyrkslef-auth-token')
        ) location.replace('/welcome/');
      } catch (e) {}
    </script>
