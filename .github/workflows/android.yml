# Builds the Android app so it can be installed on a phone for testing.
# Runs when the app changes, or by hand from the Actions tab.
name: Android test build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm ci
      - name: Build the web app
        run: npm run build
      - name: Copy it into the Android project
        run: npx cap sync android
      - name: Build the test app
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ShiftKind-android-test
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
